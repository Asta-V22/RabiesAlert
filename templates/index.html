<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DogGuard — Canine Health Monitor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Code+Pro:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#1a1c14;--surface:#22241a;--card:#2a2d20;--border:#3a3d2e;--green:#7db87d;--amber:#d4a843;--red:#c0614a;--text:#e8e4d4;--muted:#8a8770;--accent:#9bc49b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}
.app{min-height:100vh;display:flex;flex-direction:column}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:12px}
.logo-text{font-family:'Playfair Display',serif;font-size:22px;color:var(--accent)}
.logo-sub{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px}
.nav{display:flex;gap:4px}
.nav-btn{background:none;border:1px solid transparent;border-radius:6px;color:var(--muted);padding:7px 16px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all .18s}
.nav-btn:hover{color:var(--text);border-color:var(--border)}
.nav-btn.active{background:var(--card);border-color:var(--border);color:var(--accent)}
.main{display:flex;flex:1}
.sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;overflow-y:auto;flex-shrink:0}
.content{flex:1;padding:32px;overflow-y:auto}
.sidebar-title{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;padding-left:8px}
.dog-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;cursor:pointer;transition:background .15s;margin-bottom:4px;border:1px solid transparent}
.dog-item:hover{background:var(--card)}
.dog-item.selected{background:var(--card);border-color:var(--border)}
.dog-avatar{width:36px;height:36px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
.dog-avatar img{width:100%;height:100%;object-fit:cover}
.dog-info{flex:1;min-width:0}
.dog-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dog-status{font-size:11px;color:var(--muted);margin-top:1px}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.status-ok{background:var(--green)}.status-warn{background:var(--amber)}.status-alert{background:var(--red)}
.add-dog-btn{width:100%;padding:10px;border:1px dashed var(--border);border-radius:8px;background:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-top:12px;transition:all .18s}
.add-dog-btn:hover{border-color:var(--accent);color:var(--accent);background:rgba(155,196,155,.05)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px}
.card-title{font-family:'Playfair Display',serif;font-size:16px;margin-bottom:16px;color:var(--accent);display:flex;align-items:center;gap:8px}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:48px 24px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface)}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(155,196,155,.04)}
.upload-icon{font-size:48px;margin-bottom:12px}
.upload-label{font-size:15px;color:var(--text);margin-bottom:6px}
.upload-hint{font-size:12px;color:var(--muted)}
.preview-wrap{position:relative;display:inline-block}
.preview-img{max-width:220px;max-height:220px;border-radius:8px;display:block;border:2px solid var(--border)}
.clear-btn{position:absolute;top:-8px;right:-8px;background:var(--red);border:none;color:white;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px}
.result-badge{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:8px;margin-top:16px}
.result-known{background:rgba(125,184,125,.12);border:1px solid var(--green)}
.result-unknown{background:rgba(192,97,74,.12);border:1px solid var(--red)}
.result-icon{font-size:32px}
.result-name{font-family:'Playfair Display',serif;font-size:20px}
.result-meta{font-size:12px;color:var(--muted);margin-top:2px;font-family:'Source Code Pro',monospace}
.conf-bar-wrap{margin-top:12px}
.conf-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.conf-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.conf-fill{height:100%;border-radius:2px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.conf-green{background:var(--green)}.conf-red{background:var(--red)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.full{grid-column:1/-1}
.form-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.form-input,.form-select,.form-textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border-color .18s;width:100%}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{resize:vertical;min-height:72px}
.form-select option{background:var(--card)}
.toggle-wrap{display:flex;align-items:center;gap:10px}
.toggle{width:40px;height:22px;background:var(--border);border-radius:11px;position:relative;cursor:pointer;transition:background .2s;border:none}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:white;border-radius:50%;transition:left .2s}
.toggle.on::after{left:21px}
.btn{padding:10px 20px;border-radius:7px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;transition:all .18s}
.btn-primary{background:var(--green);color:#1a1c14}
.btn-primary:hover{background:var(--accent)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{background:none;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-amber{background:rgba(212,168,67,.15);border:1px solid var(--amber);color:var(--amber)}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--border)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-20px;top:5px;width:13px;height:13px;border-radius:50%;border:2px solid var(--border);background:var(--bg)}
.tl-dot.green{border-color:var(--green);background:var(--green)}
.tl-date{font-size:10px;color:var(--muted);font-family:'Source Code Pro',monospace;margin-bottom:2px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}
.stat-value{font-family:'Source Code Pro',monospace;font-size:22px;font-weight:600}
.stat-value.green{color:var(--green)}.stat-value.amber{color:var(--amber)}.stat-value.red{color:var(--red)}
.alert{display:flex;align-items:flex-start;gap:10px;padding:12px 16px;border-radius:8px;margin-bottom:12px;font-size:13px}
.alert-warn{background:rgba(212,168,67,.1);border:1px solid var(--amber)}
.alert-red{background:rgba(192,97,74,.1);border:1px solid var(--red)}
.alert-green{background:rgba(125,184,125,.1);border:1px solid var(--green)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.section-h{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:8px}
.section-sub{color:var(--muted);font-size:13px;margin-bottom:28px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:12px;font-family:'Source Code Pro',monospace}
.tag-green{background:rgba(125,184,125,.15);color:var(--green);border:1px solid rgba(125,184,125,.3)}
.tag-amber{background:rgba(212,168,67,.15);color:var(--amber);border:1px solid rgba(212,168,67,.3)}
.tag-red{background:rgba(192,97,74,.15);color:var(--red);border:1px solid rgba(192,97,74,.3)}
.empty{text-align:center;padding:80px 24px;color:var(--muted)}
.empty-icon{font-size:56px;margin-bottom:16px;opacity:.5}
.dog-profile-header{display:flex;align-items:center;gap:20px;margin-bottom:28px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.dog-profile-avatar{width:72px;height:72px;border-radius:50%;border:2px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden;flex-shrink:0}
.dog-profile-avatar img{width:100%;height:100%;object-fit:cover}
.dog-profile-name{font-family:'Playfair Display',serif;font-size:26px}
.dog-profile-breed{color:var(--muted);font-size:13px;margin-top:3px}
.dog-profile-tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.top-k-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;font-family:'Source Code Pro',monospace}
.top-k-item:last-child{border-bottom:none}
.model-prompt{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;font-size:12px;color:var(--muted);font-family:'Source Code Pro',monospace;line-height:1.7}
.error-box{background:rgba(192,97,74,.1);border:1px solid var(--red);border-radius:8px;padding:12px 16px;font-size:13px;color:var(--red);margin-top:12px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback } = React;

const BACKEND = "";  // Empty = same origin (Flask serves both frontend and backend)

// Helpers
const today = () => new Date().toISOString().split('T')[0];
const daysBetween = (a,b) => { if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); };
const dueStatus = (d) => { if(!d) return null; const diff=daysBetween(today(),d); if(diff<0) return 'overdue'; if(diff<=30) return 'soon'; return 'ok'; };
const formatDate = (d) => { if(!d) return '—'; return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}); };

// Real ML inference — calls Flask backend 
async function runInference(imageBase64) {
  const resp = await fetch(`${BACKEND}/predict`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image_b64: imageBase64 }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || `Server error ${resp.status}`);
  }
  return resp.json();
}

async function registerWithBackend(dogName, imageBase64) {
  const resp = await fetch(`${BACKEND}/register`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ dog_name: dogName, image_b64: imageBase64 }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || `Server error ${resp.status}`);
  }
  return resp.json();
}

//  Initial demo data 
const DEMO_DOGS = [
  { id:'d1', name:'Bruno', breed:'German Shepherd', dob:'2020-03-15', sex:'Male', weight:'28 kg', color:'Black & Tan', owner:'Rajesh Kumar', area:'Sector 4, Ashta', vaccinated:true, rabiesVaccDate:'2024-06-10', rabiesVaccDue:'2025-06-10', dhppDate:'2024-06-10', dhppDue:'2025-06-10', lastCheckup:'2024-12-01', nextCheckup:'2025-06-01', notes:'Friendly. Slight limping on left hind leg reported Dec 2024.', photoUrl:null, encounters:[{date:'2025-03-10',location:'Near market',note:'Identified via scan. Healthy.'}] },
  { id:'d2', name:'Kali', breed:'Indian Pariah', dob:'2019-07-22', sex:'Female', weight:'14 kg', color:'Brown', owner:'Street (monitored)', area:'Main Bazaar, Ashta', vaccinated:true, rabiesVaccDate:'2024-02-15', rabiesVaccDue:'2025-02-15', dhppDate:'2024-02-15', dhppDue:'2025-02-15', lastCheckup:'2024-02-15', nextCheckup:'2025-02-15', notes:'Community dog. Sterilized.', photoUrl:null, encounters:[{date:'2025-02-20',location:'Main Bazaar',note:'Spotted, appears healthy.'}] },
];

// Sub-components 
function VaccineBadge({vaccinated, dueDate, label}) {
  const st = vaccinated ? dueStatus(dueDate) : 'none';
  if(st==='overdue') return <span className="tag tag-red">⚠ {label} Overdue</span>;
  if(st==='soon')    return <span className="tag tag-amber">⏰ {label} Due Soon</span>;
  if(st==='ok')      return <span className="tag tag-green">✓ {label} OK</span>;
  return <span className="tag tag-red">✗ {label} Not Vaccinated</span>;
}

function DogProfile({dog, onEdit}) {
  if(!dog) return <div className="empty"><div className="empty-icon">🐾</div><div>Select a dog or add a new one.</div></div>;
  const alerts = [];
  if(!dog.vaccinated) alerts.push({type:'red', msg:`${dog.name} has NOT been vaccinated — rabies risk.`});
  else {
    const rs=dueStatus(dog.rabiesVaccDue); const cs=dueStatus(dog.nextCheckup);
    if(rs==='overdue') alerts.push({type:'red', msg:`Rabies booster OVERDUE (was due ${formatDate(dog.rabiesVaccDue)}).`});
    if(rs==='soon')    alerts.push({type:'warn', msg:`Rabies booster due ${formatDate(dog.rabiesVaccDue)}.`});
    if(cs==='overdue') alerts.push({type:'red', msg:`Health checkup OVERDUE since ${formatDate(dog.nextCheckup)}.`});
    if(cs==='soon')    alerts.push({type:'warn', msg:`Health checkup due ${formatDate(dog.nextCheckup)}.`});
  }
  return (
    <div>
      <div className="dog-profile-header">
        <div className="dog-profile-avatar">{dog.photoUrl?<img src={dog.photoUrl} alt={dog.name}/>:'🐕'}</div>
        <div style={{flex:1}}>
          <div className="dog-profile-name">{dog.name}</div>
          <div className="dog-profile-breed">{dog.breed} · {dog.sex} · Born {formatDate(dog.dob)}</div>
          <div className="dog-profile-tags">
            <VaccineBadge vaccinated={dog.vaccinated} dueDate={dog.rabiesVaccDue} label="Rabies"/>
            <VaccineBadge vaccinated={dog.vaccinated} dueDate={dog.dhppDue} label="DHPP"/>
            <span className="tag tag-green" style={{opacity:.7}}>📍 {dog.area}</span>
          </div>
        </div>
        <button className="btn btn-outline" onClick={()=>onEdit(dog)}>✏ Edit</button>
      </div>
      {alerts.map((a,i)=><div key={i} className={`alert alert-${a.type==='red'?'red':'warn'}`}><span>{a.type==='red'?'🚨':'⚠️'}</span><span>{a.msg}</span></div>)}
      <div className="two-col">
        <div className="card">
          <div className="card-title">🪪 Identity</div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            {[['Breed',dog.breed],['Sex',dog.sex],['DOB',formatDate(dog.dob)],['Weight',dog.weight],['Color',dog.color],['Owner',dog.owner],['Area',dog.area]].map(([k,v])=>(
              <tr key={k}><td style={{color:'var(--muted)',padding:'5px 0',width:'40%'}}>{k}</td><td style={{padding:'5px 0'}}>{v||'—'}</td></tr>
            ))}
          </table>
        </div>
        <div className="card">
          <div className="card-title">💉 Vaccination & Health</div>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            {[['Rabies Last',formatDate(dog.rabiesVaccDate)],['Rabies Due',formatDate(dog.rabiesVaccDue)],['DHPP Last',formatDate(dog.dhppDate)],['DHPP Due',formatDate(dog.dhppDue)],['Last Checkup',formatDate(dog.lastCheckup)],['Next Checkup',formatDate(dog.nextCheckup)]].map(([k,v])=>(
              <tr key={k}><td style={{color:'var(--muted)',padding:'5px 0',width:'50%'}}>{k}</td><td style={{padding:'5px 0',fontFamily:"'Source Code Pro',monospace",fontSize:12}}>{v}</td></tr>
            ))}
          </table>
          {dog.notes&&<div style={{marginTop:12,padding:'10px',background:'var(--surface)',borderRadius:6,fontSize:12,color:'var(--muted)',fontStyle:'italic'}}>📝 {dog.notes}</div>}
        </div>
      </div>
      <div className="card">
        <div className="card-title">📋 Encounter Log</div>
        {dog.encounters&&dog.encounters.length>0?(
          <div className="timeline">{[...dog.encounters].reverse().map((e,i)=>(
            <div className="tl-item" key={i}>
              <div className="tl-dot green"/>
              <div className="tl-date">{formatDate(e.date)} · {e.location}</div>
              <div>{e.note}</div>
            </div>
          ))}</div>
        ):<div style={{color:'var(--muted)',fontSize:13}}>No encounters logged yet.</div>}
      </div>
    </div>
  );
}

function DogForm({dog, onSave, onCancel}) {
  const empty = {name:'',breed:'',dob:'',sex:'Male',weight:'',color:'',owner:'',area:'',vaccinated:false,rabiesVaccDate:'',rabiesVaccDue:'',dhppDate:'',dhppDue:'',lastCheckup:'',nextCheckup:'',notes:'',photoUrl:null,encounters:[]};
  const [form,setForm] = useState(dog||empty);
  const set = k => e => setForm(f=>({...f,[k]:e.target.value}));
  const toggle = k => () => setForm(f=>({...f,[k]:!f[k]}));
  const handlePhoto = e => {
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>setForm(f=>({...f,photoUrl:ev.target.result}));
    reader.readAsDataURL(file);
  };
  return (
    <div>
      <div className="section-h">{dog?`Edit — ${dog.name}`:'Register New Dog'}</div>
      <div className="section-sub">Fill in the dog's details for the health monitoring database.</div>
      <div className="card">
        <div className="card-title">🪪 Identity & Physical</div>
        <div className="form-grid">
          {[['name','Name','e.g. Bruno'],['breed','Breed','e.g. Indian Pariah'],['weight','Weight','e.g. 18 kg'],['color','Coat Color','e.g. Brown with white chest'],['owner','Owner / Guardian','Name or Street'],['area','Area / Location','e.g. Ward 5, Ashta']].map(([k,l,p])=>(
            <div className="form-group" key={k}><label className="form-label">{l}</label><input className="form-input" value={form[k]} onChange={set(k)} placeholder={p}/></div>
          ))}
          <div className="form-group"><label className="form-label">Date of Birth</label><input className="form-input" type="date" value={form.dob} onChange={set('dob')}/></div>
          <div className="form-group"><label className="form-label">Sex</label><select className="form-select" value={form.sex} onChange={set('sex')}><option>Male</option><option>Female</option><option>Unknown</option></select></div>
          <div className="form-group full"><label className="form-label">Profile Photo</label><input type="file" accept="image/*" className="form-input" style={{padding:'7px'}} onChange={handlePhoto}/>{form.photoUrl&&<img src={form.photoUrl} style={{marginTop:8,maxHeight:100,borderRadius:6}} alt="preview"/>}</div>
        </div>
      </div>
      <div className="card">
        <div className="card-title">💉 Vaccination & Health</div>
        <div style={{marginBottom:16}}><div className="toggle-wrap"><button className={`toggle ${form.vaccinated?'on':''}`} onClick={toggle('vaccinated')}/><span style={{fontSize:14}}>Vaccinated</span></div></div>
        <div className="form-grid">
          {[['rabiesVaccDate','Rabies Vaccine Date'],['rabiesVaccDue','Rabies Next Due'],['dhppDate','DHPP Vaccine Date'],['dhppDue','DHPP Next Due'],['lastCheckup','Last Checkup'],['nextCheckup','Next Checkup Due']].map(([k,l])=>(
            <div className="form-group" key={k}><label className="form-label">{l}</label><input className="form-input" type="date" value={form[k]} onChange={set(k)}/></div>
          ))}
          <div className="form-group full"><label className="form-label">Notes</label><textarea className="form-textarea" value={form.notes} onChange={set('notes')} placeholder="Health observations, behaviour, injuries..."/></div>
        </div>
      </div>
      <div className="btn-row">
        <button className="btn btn-primary" onClick={()=>onSave(form)}>💾 Save Dog</button>
        <button className="btn btn-outline" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function ScanPage({dogs, setDogs}) {
  const [imgSrc,setImgSrc]         = useState(null);
  const [imgB64,setImgB64]         = useState(null);
  const [drag,setDrag]             = useState(false);
  const [loading,setLoading]       = useState(false);
  const [result,setResult]         = useState(null);
  const [error,setError]           = useState(null);
  const [registerMode,setRegMode]  = useState(false);
  const [newName,setNewName]       = useState('');
  const [encounter,setEncounter]   = useState({location:'',note:''});
  const [saved,setSaved]           = useState(false);
  const [regLoading,setRegLoading] = useState(false);
  const fileRef = useRef();

  const loadFile = file => {
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      setImgSrc(ev.target.result);
      setImgB64(ev.target.result); // keep full data URI — backend strips prefix
      setResult(null); setError(null); setRegMode(false); setSaved(false);
    };
    reader.readAsDataURL(file);
  };

  const onDrop = useCallback(e=>{ e.preventDefault(); setDrag(false); loadFile(e.dataTransfer.files[0]); },[]);

  const analyze = async () => {
    if(!imgB64) return;
    setLoading(true); setError(null); setResult(null);
    try {
      const r = await runInference(imgB64);
      setResult(r);
    } catch(e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  const logEncounter = () => {
    if(!result||!result.matched_name) return;
    const enc={date:today(),location:encounter.location||'Unknown',note:encounter.note||'Identified via face scan.'};
    setDogs(prev=>prev.map(d=>d.name===result.matched_name?{...d,encounters:[...(d.encounters||[]),enc]}:d));
    setSaved(true);
  };

  const registerNew = async () => {
    if(!newName.trim()||!imgB64) return;
    setRegLoading(true);
    try {
      await registerWithBackend(newName.trim(), imgB64);
      const newDog={id:`d${Date.now()}`,name:newName.trim(),breed:'Unknown',dob:'',sex:'Unknown',weight:'',color:'',owner:'Street (unregistered)',area:encounter.location||'Unknown',vaccinated:false,rabiesVaccDate:'',rabiesVaccDue:'',dhppDate:'',dhppDue:'',lastCheckup:'',nextCheckup:today(),notes:'Auto-registered via face scan.',photoUrl:imgSrc,encounters:[{date:today(),location:encounter.location||'Unknown',note:'First scan — registered.'}]};
      setDogs(prev=>[...prev,newDog]);
      setSaved(true); setRegMode(false);
    } catch(e) {
      setError(e.message);
    } finally {
      setRegLoading(false);
    }
  };

  return (
    <div>
      <div className="section-h">🔍 Dog Face Recognition</div>
      <div className="section-sub">Upload a photo to identify the dog against your trained Siamese model.</div>
      <div className="two-col">
        <div>
          {!imgSrc?(
            <div className={`upload-zone ${drag?'drag':''}`} onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)} onDrop={onDrop} onClick={()=>fileRef.current?.click()}>
              <div className="upload-icon">📷</div>
              <div className="upload-label">Drop dog photo here</div>
              <div className="upload-hint">or click to browse · JPG, PNG, WEBP</div>
              <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={e=>loadFile(e.target.files[0])}/>
            </div>
          ):(
            <div style={{textAlign:'center'}}>
              <div className="preview-wrap">
                <img src={imgSrc} className="preview-img" alt="Dog"/>
                <button className="clear-btn" onClick={()=>{setImgSrc(null);setImgB64(null);setResult(null);setError(null);setSaved(false);}}>✕</button>
              </div>
              <div className="btn-row" style={{justifyContent:'center',marginTop:16}}>
                <button className="btn btn-primary" onClick={analyze} disabled={loading}>
                  {loading?<><span className="spinner"/>Analyzing...</>:'🧠 Run Recognition'}
                </button>
              </div>
            </div>
          )}

          {error && <div className="error-box">⚠ {error}<br/><small>Make sure Flask is running on port 5000.</small></div>}

          {result&&(
            <div>
              <div className={`result-badge ${result.is_known?'result-known':'result-unknown'}`}>
                <div className="result-icon">{result.is_known?'✅':'❓'}</div>
                <div>
                  <div className="result-name">{result.is_known?result.matched_name:'Unknown Dog'}</div>
                  <div className="result-meta">dist={result.distance?.toFixed(4)} · τ={result.threshold?.toFixed(3)} · conf={(((result.confidence||0)*100).toFixed(1))}%</div>
                </div>
              </div>
              <div className="conf-bar-wrap">
                <div className="conf-label">Confidence</div>
                <div className="conf-bar"><div className={`conf-fill ${result.is_known?'conf-green':'conf-red'}`} style={{width:`${Math.round((result.confidence||0)*100)}%`}}/></div>
              </div>
              {result.top_k?.length>0&&(
                <div style={{marginTop:10}}>
                  <div style={{fontSize:11,color:'var(--muted)',marginBottom:4,letterSpacing:1}}>TOP MATCHES</div>
                  {result.top_k.map((r,i)=>(
                    <div className="top-k-item" key={i}><span>{i+1}. {r.name}</span><span style={{color:'var(--muted)'}}>d={r.distance?.toFixed(4)}</span></div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>

        <div>
          {result&&!saved&&(
            <div className="card">
              <div className="card-title">📍 Log This Sighting</div>
              <div className="form-grid">
                <div className="form-group full"><label className="form-label">Location</label><input className="form-input" placeholder="e.g. Near school gate" value={encounter.location} onChange={e=>setEncounter(p=>({...p,location:e.target.value}))}/></div>
                <div className="form-group full"><label className="form-label">Observation</label><textarea className="form-textarea" placeholder="Health observations, behaviour..." value={encounter.note} onChange={e=>setEncounter(p=>({...p,note:e.target.value}))}/></div>
              </div>
              <div className="btn-row">
                {result.is_known&&<button className="btn btn-primary" onClick={logEncounter}>📋 Log Encounter</button>}
                {!result.is_known&&<button className="btn btn-amber" onClick={()=>setRegMode(true)}>➕ Register This Dog</button>}
              </div>
            </div>
          )}
          {registerMode&&!saved&&(
            <div className="card">
              <div className="card-title">🐾 Register Unknown Dog</div>
              <div className="form-group" style={{marginBottom:12}}>
                <label className="form-label">Assign a Name</label>
                <input className="form-input" value={newName} onChange={e=>setNewName(e.target.value)} placeholder="e.g. Spotty"/>
              </div>
              <div className="btn-row">
                <button className="btn btn-primary" onClick={registerNew} disabled={!newName.trim()||regLoading}>
                  {regLoading?<><span className="spinner"/>Saving...</>:'✅ Register & Save'}
                </button>
                <button className="btn btn-outline" onClick={()=>setRegMode(false)}>Cancel</button>
              </div>
            </div>
          )}
          {saved&&<div className="alert alert-green"><span>✅</span><span>Saved to Flask backend and database.</span></div>}
          <div className="card" style={{marginTop:16}}>
            <div className="card-title">ℹ Model Info</div>
            <div className="model-prompt">
              Backbone: ResNet50 (ImageNet pretrained)<br/>
              Loss: Triplet Loss (margin=0.3)<br/>
              Embedding: 128-dim · L2-normalized<br/>
              Metric: Euclidean distance<br/>
              Threshold: EER-calibrated (auto-loaded)<br/>
              New dogs: no retraining needed
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function DashboardPage({dogs}) {
  const total=dogs.length, vaccinated=dogs.filter(d=>d.vaccinated).length;
  const overdue=dogs.filter(d=>dueStatus(d.rabiesVaccDue)==='overdue'||dueStatus(d.nextCheckup)==='overdue').length;
  const dueSoon=dogs.filter(d=>(dueStatus(d.rabiesVaccDue)==='soon'||dueStatus(d.nextCheckup)==='soon')&&dueStatus(d.rabiesVaccDue)!=='overdue').length;
  const alerts=dogs.flatMap(d=>{
    const a=[];
    if(!d.vaccinated) a.push({type:'red',dog:d.name,msg:'Not vaccinated — rabies risk.'});
    else {
      const rs=dueStatus(d.rabiesVaccDue);
      if(rs==='overdue') a.push({type:'red',dog:d.name,msg:`Rabies overdue (was ${formatDate(d.rabiesVaccDue)}).`});
      if(rs==='soon')    a.push({type:'warn',dog:d.name,msg:`Rabies due ${formatDate(d.rabiesVaccDue)}.`});
    }
    const cs=dueStatus(d.nextCheckup);
    if(cs==='overdue') a.push({type:'red',dog:d.name,msg:`Checkup overdue (was ${formatDate(d.nextCheckup)}).`});
    if(cs==='soon')    a.push({type:'warn',dog:d.name,msg:`Checkup due ${formatDate(d.nextCheckup)}.`});
    return a;
  });
  return (
    <div>
      <div className="section-h">🐾 Rabies Prevention Dashboard</div>
      <div className="section-sub">Overview of all registered dogs in the monitored area.</div>
      <div className="stats-row">
        <div className="stat-card"><div className="stat-label">Registered</div><div className="stat-value">{total}</div></div>
        <div className="stat-card"><div className="stat-label">Vaccinated</div><div className="stat-value green">{vaccinated}</div></div>
        <div className="stat-card"><div className="stat-label">Overdue</div><div className="stat-value red">{overdue}</div></div>
        <div className="stat-card"><div className="stat-label">Due Soon (30d)</div><div className="stat-value amber">{dueSoon}</div></div>
      </div>
      {alerts.length>0&&<div className="card"><div className="card-title">🚨 Action Required</div>{alerts.map((a,i)=><div key={i} className={`alert alert-${a.type==='red'?'red':'warn'}`}><span>{a.type==='red'?'🚨':'⚠️'}</span><span><strong>{a.dog}</strong> — {a.msg}</span></div>)}</div>}
      <div className="card">
        <div className="card-title">📋 All Registered Dogs</div>
        <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
          <thead><tr style={{color:'var(--muted)',fontSize:11,textTransform:'uppercase',letterSpacing:1}}>
            {['Name','Breed','Area','Rabies','Due Date','Last Seen'].map(h=><th key={h} style={{textAlign:'left',padding:'6px 10px',borderBottom:'1px solid var(--border)'}}>{h}</th>)}
          </tr></thead>
          <tbody>{dogs.map(d=>{
            const rs=d.vaccinated?dueStatus(d.rabiesVaccDue):'none';
            const lastEnc=d.encounters?.[d.encounters.length-1];
            return(<tr key={d.id} style={{borderBottom:'1px solid var(--border)'}}>
              <td style={{padding:'10px'}}><strong>{d.name}</strong></td>
              <td style={{padding:'10px',color:'var(--muted)'}}>{d.breed}</td>
              <td style={{padding:'10px',color:'var(--muted)'}}>{d.area}</td>
              <td style={{padding:'10px'}}>
                {rs==='overdue'&&<span className="tag tag-red">⚠ Overdue</span>}
                {rs==='soon'&&<span className="tag tag-amber">⏰ Due Soon</span>}
                {rs==='ok'&&<span className="tag tag-green">✓ OK</span>}
                {rs==='none'&&<span className="tag tag-red">✗ None</span>}
              </td>
              <td style={{padding:'10px',fontFamily:"'Source Code Pro',monospace",fontSize:12}}>{formatDate(d.rabiesVaccDue)}</td>
              <td style={{padding:'10px',color:'var(--muted)',fontSize:12}}>{lastEnc?formatDate(lastEnc.date):'—'}</td>
            </tr>);
          })}</tbody>
        </table>
        {dogs.length===0&&<div style={{textAlign:'center',padding:40,color:'var(--muted)'}}>No dogs registered yet.</div>}
      </div>
    </div>
  );
}

// Root App 
function App() {
  const [tab,setTab]           = useState('scan');
  const [dogs,setDogs]         = useState(DEMO_DOGS);
  const [selectedDog,setSel]   = useState(null);
  const [editingDog,setEditing] = useState(null);
  const [addingNew,setAdding]  = useState(false);

  const saveDog = form => {
    if(editingDog) { setDogs(prev=>prev.map(d=>d.id===editingDog.id?{...editingDog,...form}:d)); setSel(s=>s?.id===editingDog.id?{...editingDog,...form}:s); }
    else { const nd={...form,id:`d${Date.now()}`,encounters:[]}; setDogs(prev=>[...prev,nd]); setSel(nd); }
    setEditing(null); setAdding(false); setTab('dogs');
  };

  const dogStatus = d => {
    if(!d.vaccinated) return 'alert';
    if(dueStatus(d.rabiesVaccDue)==='overdue'||dueStatus(d.nextCheckup)==='overdue') return 'alert';
    if(dueStatus(d.rabiesVaccDue)==='soon'||dueStatus(d.nextCheckup)==='soon') return 'warn';
    return 'ok';
  };

  return (
    <div className="app">
      <header className="header">
        <div className="logo">
          <span style={{fontSize:28}}>🐕</span>
          <div><div className="logo-text">DogGuard</div><div className="logo-sub">Canine Health Monitor · Rabies Prevention</div></div>
        </div>
        <nav className="nav">
          {[['scan','🔍 Scan'],['dogs','🐾 Dogs'],['dashboard','📊 Dashboard']].map(([id,label])=>(
            <button key={id} className={`nav-btn ${tab===id?'active':''}`} onClick={()=>setTab(id)}>{label}</button>
          ))}
        </nav>
      </header>
      <div className="main">
        <aside className="sidebar">
          <div className="sidebar-title">Registered Dogs ({dogs.length})</div>
          {dogs.map(d=>(
            <div key={d.id} className={`dog-item ${selectedDog?.id===d.id?'selected':''}`} onClick={()=>{setSel(d);setTab('dogs');setAdding(false);setEditing(null);}}>
              <div className="dog-avatar">{d.photoUrl?<img src={d.photoUrl} alt={d.name}/>:'🐕'}</div>
              <div className="dog-info">
                <div className="dog-name">{d.name}</div>
                <div className="dog-status"><span className={`status-dot status-${dogStatus(d)}`}/>{d.breed}</div>
              </div>
            </div>
          ))}
          <button className="add-dog-btn" onClick={()=>{setAdding(true);setEditing(null);setSel(null);setTab('dogs');}}>+ Add New Dog</button>
        </aside>
        <main className="content">
          {tab==='scan'&&<ScanPage dogs={dogs} setDogs={setDogs}/>}
          {tab==='dashboard'&&<DashboardPage dogs={dogs}/>}
          {tab==='dogs'&&(
            (addingNew||editingDog)
              ?<DogForm dog={editingDog} onSave={saveDog} onCancel={()=>{setAdding(false);setEditing(null);}}/>
              :<DogProfile dog={selectedDog?dogs.find(d=>d.id===selectedDog.id):null} onEdit={d=>{setEditing(d);setAdding(false);}}/>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
